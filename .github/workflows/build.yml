name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Build All Targets
        id: buildstep
        continue-on-error: true
        run: |
          set +e
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-output.log
          echo "XCODEBUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit ${PIPESTATUS[0]}
          
      - name: Show build errors
        if: steps.buildstep.outcome == 'failure'
        run: |
          echo '```' > summary.txt
          grep -i "error:" build-output.log | head -50 >> summary.txt || echo "No error: lines" >> summary.txt
          echo '```' >> summary.txt
          echo '```' >> summary.txt
          tail -100 build-output.log >> summary.txt || true
          echo '```' >> summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: xcodebuild -version
        
      - name: Build Archive
        id: archivestep
        continue-on-error: true
        run: |
          set +e
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO 2>&1 | tee archive-output.log
          echo "ARCHIVE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit ${PIPESTATUS[0]}

      - name: Show archive errors
        if: steps.archivestep.outcome == 'failure'
        run: |
          echo '```' > summary.txt
          grep -i "error:" archive-output.log | head -50 >> summary.txt || echo "No error: lines" >> summary.txt
          echo '```' >> summary.txt
          echo '```' >> summary.txt
          tail -100 archive-output.log >> summary.txt || true
          echo '```' >> summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1
          
      - name: Create IPA
        run: |
          set -e
          ARCHIVE_DIR="${{ github.workspace }}/build/JSKeyborad.xcarchive"
          APP_PATH=$(find "$ARCHIVE_DIR" -name "JSKeyborad.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: JSKeyborad.app not found in archive"
            find "$ARCHIVE_DIR" -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p ${{ github.workspace }}/build/ipa/Payload
          cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
          cd ${{ github.workspace }}/build/ipa
          zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
          echo "IPA created successfully"
          
      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: ${{ github.workspace }}/build/JSKeyborad.ipa
          retention-days: 30
