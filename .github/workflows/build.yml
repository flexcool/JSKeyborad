name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Build All Targets
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          BUILD_EXIT=$?
          echo "Build exit code: $BUILD_EXIT"
          tail -100 build.log
          exit $BUILD_EXIT
          
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 1

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: xcodebuild -version
        
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            > archive.log 2>&1
          ARCHIVE_EXIT=$?
          echo "Archive exit code: $ARCHIVE_EXIT"
          tail -100 archive.log
          exit $ARCHIVE_EXIT

      - name: Upload archive log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
          retention-days: 1
          
      - name: Create IPA
        run: |
          set -e
          ARCHIVE="${{ github.workspace }}/build/JSKeyborad.xcarchive"
          echo "=== Archive structure ===" 
          find "$ARCHIVE" -type d | head -40
          echo "=== .app / .appex files ==="
          find "$ARCHIVE" \( -name "*.app" -o -name "*.appex" \) 2>/dev/null
          echo "=== Products contents ==="
          ls -laR "$ARCHIVE/Products/" 2>/dev/null || echo "No Products dir"
          
          APP_PATH=$(find "$ARCHIVE" -name "JSKeyborad.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            mkdir -p ${{ github.workspace }}/build/ipa/Payload
            cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
            cd ${{ github.workspace }}/build/ipa
            zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
            echo "IPA created"
            ls -lh ${{ github.workspace }}/build/JSKeyborad.ipa
          else
            echo "No .app found in archive, trying exportArchive..."
            cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath ${{ github.workspace }}/build \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              2>&1 || true
            IPA=$(find ${{ github.workspace }}/build -name "*.ipa" -type f 2>/dev/null | head -1)
            if [ -n "$IPA" ]; then
              echo "Found IPA via export: $IPA"
              cp "$IPA" ${{ github.workspace }}/build/JSKeyborad.ipa
            else
              echo "ERROR: Could not create IPA"
              exit 1
            fi
          fi
          
      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: ${{ github.workspace }}/build/JSKeyborad.ipa
          retention-days: 30
