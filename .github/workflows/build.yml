name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Build All Targets
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-simulator.log | xcpretty

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: xcodebuild -version
        
      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tee build-archive.log | xcpretty
          
      - name: List Archive Products
        if: always()
        run: |
          echo "=== Archive structure ==="
          find ${{ github.workspace }}/build/JSKeyborad.xcarchive/Products -type d -maxdepth 3 2>/dev/null || echo "Archive not found"
          find ${{ github.workspace }}/build/JSKeyborad.xcarchive -name "*.app" 2>/dev/null || echo "No .app found"
          
      - name: Create IPA
        run: |
          set -e
          ARCHIVE_PATH="${{ github.workspace }}/build/JSKeyborad.xcarchive"
          APP_PATH="${ARCHIVE_PATH}/Products/Applications/JSKeyborad.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: JSKeyborad.app not found at $APP_PATH"
            echo "Archive contents:"
            find "$ARCHIVE_PATH" -type f -name "*.app" 2>/dev/null
            exit 1
          fi
          
          mkdir -p ${{ github.workspace }}/build/ipa/Payload
          cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
          cd ${{ github.workspace }}/build/ipa
          zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
          echo "IPA created successfully"
          
      - name: Show IPA
        run: ls -lh ${{ github.workspace }}/build/JSKeyborad.ipa
          
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: ${{ github.workspace }}/build/JSKeyborad.ipa
          retention-days: 30
          
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archive-Build-Log
          path: build-archive.log
          retention-days: 7
