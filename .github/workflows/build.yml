name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SCHEME: JSKeyborad
  DESTINATION: 'platform=iOS Simulator,name=iPhone 15,OS=17.2'

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show Xcode version
        run: xcodebuild -version
        
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project JSKeyborad.xcodeproj \
            -scheme $SCHEME
        
      - name: Build
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme $SCHEME \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty
          
      - name: Run Tests
        run: |
          xcodebuild test \
            -project JSKeyborad.xcodeproj \
            -scheme $SCHEME \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty
            
  build_keyboard:
    name: Build Keyboard Extension
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Build Keyboard Extension
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme "JSKeyborad-KeyboardExtension" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty
            
  build_widget:
    name: Build Widget Extension
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Build Widget Extension
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme "JSKeyborad-WidgetExtension" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  lint:
    name: SwiftLint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: SwiftLint
        run: |
          if which swiftlint > /dev/null; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "SwiftLint not installed, skipping..."
          fi
