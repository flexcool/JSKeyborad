name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Build All Targets
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -80
          echo "Exit: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: xcodebuild -version
        
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            > archive.log 2>&1
          ARCHIVE_EXIT=$?
          echo "Archive exit code: $ARCHIVE_EXIT"
          tail -100 archive.log
          exit $ARCHIVE_EXIT
          
      - name: Export IPA
        run: |
          set -e
          ARCHIVE="${{ github.workspace }}/build/JSKeyborad.xcarchive"
          
          echo "=== Archive structure ==="
          find "$ARCHIVE" -type d 2>/dev/null | head -40
          echo "=== .app / .appex files ==="
          find "$ARCHIVE" \( -name "*.app" -o -name "*.appex" \) 2>/dev/null
          
          # Try exportArchive first
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath ${{ github.workspace }}/build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tail -30
          
          # Find IPA
          IPA=$(find ${{ github.workspace }}/build -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" ${{ github.workspace }}/build/JSKeyborad.ipa 2>/dev/null || true
          fi
          
          # Fallback: manually zip .app
          if [ ! -f "${{ github.workspace }}/build/JSKeyborad.ipa" ]; then
            APP_PATH=$(find "$ARCHIVE" -name "JSKeyborad.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "Fallback: creating IPA from $APP_PATH"
              mkdir -p ${{ github.workspace }}/build/ipa/Payload
              cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
              cd ${{ github.workspace }}/build/ipa
              zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
            fi
          fi
          
          if [ -f "${{ github.workspace }}/build/JSKeyborad.ipa" ]; then
            echo "SUCCESS: IPA created"
            ls -lh ${{ github.workspace }}/build/JSKeyborad.ipa
          else
            echo "FAILED: Could not create IPA"
            ls -laR ${{ github.workspace }}/build/ 2>/dev/null | head -40
            exit 1
          fi
          
      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: ${{ github.workspace }}/build/JSKeyborad.ipa
          retention-days: 30
