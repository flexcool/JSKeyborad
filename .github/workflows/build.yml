name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad || true
        
      - name: Build Main App
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: Build Keyboard Extension
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad-KeyboardExtension \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
            
      - name: Build Widget Extension
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad-WidgetExtension \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Clean build directory
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/JSKeyborad-*
        
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO | xcpretty
          
      - name: Export IPA
        run: |
          mkdir -p build/ipa
          
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath build/JSKeyborad.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa | xcpretty
          
      - name: List IPA files
        run: |
          echo "=== Generated IPA files ==="
          ls -la build/ipa/
          
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: build/ipa/*.ipa
          retention-days: 30
          
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            ~/Library/Logs/DiagnosticReports/
          retention-days: 7
