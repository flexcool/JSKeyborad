name: Build JSKeyborad

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
        
      - name: Build All Targets
        run: |
          xcodebuild clean build \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -80
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

  lint:
    name: Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  archive:
    name: Archive IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: xcodebuild -version
        
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tail -80
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}
          
      - name: Export IPA
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -exportPath ${{ github.workspace }}/build/export \
            -exportOptionsPlist exportOptions.plist \
            2>&1 | tail -20
          echo "Exit code: ${PIPESTATUS[0]}"
          
          if [ -f "${{ github.workspace }}/build/export/JSKeyborad.ipa" ]; then
            echo "IPA exported successfully"
            ls -lh ${{ github.workspace }}/build/export/JSKeyborad.ipa
          else
            echo "ERROR: IPA not found at expected path"
            find ${{ github.workspace }}/build/export -type f 2>/dev/null
            find ${{ github.workspace }}/build -name "*.ipa" 2>/dev/null
            # Fallback: try to find .app in archive and create IPA manually
            APP_PATH=$(find ${{ github.workspace }}/build/JSKeyborad.xcarchive -name "JSKeyborad.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "Found app at: $APP_PATH, creating IPA manually"
              mkdir -p ${{ github.workspace }}/build/ipa/Payload
              cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
              cd ${{ github.workspace }}/build/ipa
              zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
              echo "IPA created manually"
            fi
          fi
          
      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 7
          
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-IPA
          path: ${{ github.workspace }}/build/export/JSKeyborad.ipa
          retention-days: 30
