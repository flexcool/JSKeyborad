name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project JSKeyborad.xcodeproj \
            -scheme JSKeyborad \
            -archivePath ${{ github.workspace }}/build/JSKeyborad.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tail -50
          exit ${PIPESTATUS[0]}
          
      - name: Create IPA
        run: |
          set -e
          ARCHIVE="${{ github.workspace }}/build/JSKeyborad.xcarchive"
          APP_PATH=$(find "$ARCHIVE" -name "JSKeyborad.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: JSKeyborad.app not found in archive"
            find "$ARCHIVE" -name "*.app" -o -name "*.appex" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p ${{ github.workspace }}/build/ipa/Payload
          cp -r "$APP_PATH" ${{ github.workspace }}/build/ipa/Payload/
          cd ${{ github.workspace }}/build/ipa
          zip -r ${{ github.workspace }}/build/JSKeyborad.ipa Payload
          ls -lh ${{ github.workspace }}/build/JSKeyborad.ipa
            
      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-v${{ steps.version.outputs.VERSION }}
          path: ${{ github.workspace }}/build/JSKeyborad.ipa
          retention-days: 90
            
      - name: Upload Archive Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSKeyborad-Archive-v${{ steps.version.outputs.VERSION }}
          path: ${{ github.workspace }}/build/JSKeyborad.xcarchive
          retention-days: 90
            
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            ## JSKeyborad v${{ steps.version.outputs.VERSION }}
            
            ### 新功能
            - ⌨️ 自定义键盘扩展
            - 📱 桌面小组件（小号/中号）
            - 📋 剪贴板历史管理
            - 📊 使用统计图表
            - 🔍 键盘快速搜索
            
            ### 安装说明
            1. 下载 `JSKeyborad.ipa`
            2. 使用 AltStore 或 Sideloadly 安装
            3. 在 设置 > 通用 > 键盘 中添加 JSKeyborad
            4. 在任意输入框长按地球键切换到 JSKeyborad
            
            ### 注意事项
            - 无需「允许完全访问」权限
            - 所有数据仅存储在设备本地
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
